[platformio]
default_envs = uno_i2c, uno_spi

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_flags =
    -I include
lib_deps =
    adafruit/Adafruit BME280 Library

[env:uno_i2c]
build_src_filter = +<main_i2c.cpp>

[env:uno_spi]
build_src_filter = +<main_spi.cpp>
